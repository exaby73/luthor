name: Set up Luthor
description: Installs dpk and resolves the Luthor pub workspace with dpk get. Run dart-lang/setup-dart before it, because setup-dart can't load its problem matcher from inside a composite action.

inputs:
  dpk-version:
    description: Version constraint for dpk. Keep it inside the `version` constraint in dpk.yaml.
    required: false
    default: "^1.0.0"
  get:
    description: Run `dpk get`. Set to "false" to change pubspecs first and run `dpk get` yourself.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install dpk
      shell: bash
      env:
        DPK_VERSION: ${{ inputs.dpk-version }}
      run: |
        dart install dpk "$DPK_VERSION"
        echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

    - name: Resolve workspace dependencies
      if: inputs.get == 'true'
      shell: bash
      run: dpk get
