# yaml-language-server: $schema=https://raw.githubusercontent.com/exaby73/dpk/main/schema/dpk.schema.json
version: ^1.0.0

workspace:
  - packages/luthor
  - packages/luthor/example
  - packages/luthor_generator

catalog:
  version: 1.0.0

  environment:
    sdk: ^3.11.0

  dependencies:
    luthor: 1.0.0
    luthor_generator: 1.0.0

    analyzer: ">=10.0.0 <15.0.0"
    build: ^4.0.4
    build_test: ^3.5.16
    collection: ^1.19.1
    dart_mappable: ^4.10.0
    freezed_annotation: ^3.1.0
    json_annotation: ^4.12.0
    lint: ^2.12.0
    lints: ^6.1.0
    source_gen: ^4.2.0
    test: ^1.31.1

scripts:
  analyze:
    command: dart analyze
    run_in_packages:
      - packages/*

  fix:
    command: dart fix --apply
    run_in_packages:
      - packages/*

  format:
    command: dart format --set-exit-if-changed lib test
    run_in_packages:
      - packages/*
      - packages/luthor/example

  test:
    command: dart test
    run_in_packages:
      - packages/luthor
      - packages/luthor_generator

  build:
    command: cd "$DPK_ROOT/examples/luthor_generator" && dart run build_runner build

  release:publish:
    command: dpk release publish

  post:get:
    description: Install the bundled luthor skill for local agents
    command: >-
      cd "$DPK_ROOT" &&
      npx -y skills@1.7.0 add ./skills/luthor -y -a claude-code codex &&
      dart run tool/normalize_skills_lock.dart
