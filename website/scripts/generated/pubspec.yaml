name: luthor_docs_generated
description: The models shown on the code-generation pages. Built with the real luthor_generator; the outputs are copied into src/data/generated.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  dart_mappable: ^4.10.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  luthor:
    path: ../../../packages/luthor

dev_dependencies:
  build_runner: ^2.16.1
  dart_mappable_builder: ^4.10.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  luthor_generator:
    path: ../../../packages/luthor_generator

dependency_overrides:
  luthor:
    path: ../../../packages/luthor
